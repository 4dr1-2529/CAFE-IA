name: CI Café Sostenible

# Acciones de terceros fijadas por SHA completo (recomendación OWASP / Aikido).
# actions/checkout@v4.2.2
# actions/setup-node@v4.1.0
# SonarSource/sonarcloud-github-action@v2.3.0

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - run: npm ci --prefix backend || npm install --prefix backend
      - run: npm test --prefix backend
        env:
          SKIP_INTEGRATION: '1'
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_para_tests_automatizados_min_32
          MYSQLHOST: 127.0.0.1
          MYSQLPORT: '3306'
          MYSQLUSER: root
          MYSQLPASSWORD: ''
          MYSQLDATABASE: cafe_sostenible_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - run: npm ci --prefix frontend || npm install --prefix frontend
      - run: npm run build --prefix frontend

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92 # v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependency-audit:
    name: npm audit (dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Audit backend
        run: npm audit --prefix backend --audit-level=high
        continue-on-error: true
      - name: Audit frontend
        run: npm audit --prefix frontend --audit-level=high
        continue-on-error: true
