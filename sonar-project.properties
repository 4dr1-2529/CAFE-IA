# SonarCloud — https://sonarcloud.io (importar repo 4dr1-2529/CAFE-IA)
sonar.organization=4dr1-2529
sonar.projectKey=4dr1-2529_CAFE-IA
sonar.projectName=Cafe Sostenible AI

sonar.sourceEncoding=UTF-8
sonar.javascript.node.maxspace=4096
sonar.projectBaseDir=.
sonar.newCode.referenceBranch=main

# Solo código de aplicación (React + Express)
sonar.sources=frontend/src,backend/src
sonar.inclusions=**/*.js,**/*.jsx
sonar.tests=backend/tests,testing/cypress/e2e
sonar.test.inclusions=**/*.test.js,**/*.cy.js
sonar.test.exclusions=**/testing/metricas/**,**/Plan-de-Pruebas/**

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/testing/cypress/videos/**,\
  **/testing/cypress/screenshots/**,\
  **/testing/cypress/evidencias/**,\
  **/testing/metricas/**,\
  **/ml/**,\
  **/*.sql,\
  **/backend/scripts/**,\
  **/Plan-de-Pruebas/**,\
  **/Reporte-Calidad-Software/**,\
  **/docs/**

# Duplicación (CPD): documentación, evidencias y copias intencionadas
sonar.cpd.exclusions=\
  **/Plan-de-Pruebas/**,\
  **/Reporte-Calidad-Software/**,\
  **/docs/**,\
  **/backend/scripts/**,\
  **/testing/metricas/**,\
  **/*.md,\
  **/*.txt,\
  **/*.properties,\
  **/frontend/src/utils/inputValidation.js,\
  **/backend/src/shared/inputValidation.js,\
  **/backend/src/shared/reportesSql.js,\
  **/backend/src/shared/trazabilidadSql.js

sonar.qualitygate.wait=true
