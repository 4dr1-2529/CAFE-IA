services:
  - type: web
    name: cafe-sostenible-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: cafe_sostenible
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
